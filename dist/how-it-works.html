 <a href="student-voting.html">Student voting info →</a>

<script>
(function(){
  // Hide after Election Day using Colorado local time, regardless of visitor location.
  var parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Denver',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var dateParts = Object.fromEntries(parts.map(function(p){return [p.type,p.value]}));
  if(Number(dateParts.year+dateParts.month+dateParts.day) > 20261103){
    var notice=document.getElementById('election-banner'); if(notice) notice.hidden=true;
  }
})();
</script>
